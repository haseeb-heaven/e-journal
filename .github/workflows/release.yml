name: Release

on:
  push:
    tags:
      - "v*"

# Build jobs only need the checked-out source; the release job is the sole
# place that publishes assets.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: e-journal-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: e-journal-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: e-journal-windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: e-journal-linux-x86_64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/e-journal" dist/
          cp README.md LICENSE dist/
          cd dist
          zip -9 "../${{ matrix.asset }}.zip" e-journal README.md LICENSE

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/e-journal.exe" dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.asset }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: E-Journal ${{ github.ref_name }}
          body: |
            E-Journal is a quiet, local-first desktop journal written in Rust with
            egui and SQLite.

            Downloads:
            - macOS Apple Silicon: `e-journal-macos-arm64.zip`
            - macOS Intel: `e-journal-macos-x86_64.zip`
            - Windows x86_64: `e-journal-windows-x86_64.zip`
            - Linux x86_64: `e-journal-linux-x86_64.zip`

            Verify downloads with `SHA256SUMS.txt`.

            macOS builds are not code-signed. If Gatekeeper blocks the app,
            right-click it and choose **Open**, or clear the quarantine attribute
            with `xattr -dr com.apple.quarantine e-journal`.
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
