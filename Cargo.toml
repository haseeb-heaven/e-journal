[package]
name = "journal-app"
version = "0.1.0"
edition = "2021"
description = "A local-first, single-user journal with a native egui interface"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
