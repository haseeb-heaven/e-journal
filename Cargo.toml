[package]
name = "e-journal"
version = "1.0.0"
edition = "2021"
description = "E-Journal: a local-first, single-user desktop journal built with Rust, egui, and SQLite"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
thiserror = "2.0.21"
unicode-casefold = "0.2.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[profile.release]
lto = "thin"
strip = true
